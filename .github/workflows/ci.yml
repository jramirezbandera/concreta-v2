# Verificación en rama y en pull request.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ NO BASTA CON LA PUERTA DEL DESPLIEGUE
# ─────────────────────────────────────────────────────────────────────────────
# `deploy.yml` sólo corre al empujar a `main`. Eso impide publicar algo roto,
# pero no es una red: el trabajo vive en ramas durante días, y ahí no se
# ejecutaba nada más que lo que el hook de pre-commit alcanza —que se salta con
# `--no-verify` y que, sin `dist/`, nunca llega al golden del bundle—. Enterarse
# al fusionar es enterarse tarde.
#
# Los dos disparadores se solapan mientras hay un PR abierto desde una rama de
# este mismo repo (empujar dispara `push` y actualiza el `pull_request`). Se
# acepta a propósito: `pull_request` es el que produce el check que se puede
# exigir en la protección de rama, y `push` es el que cubre las ramas que
# todavía no tienen PR.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Mismo pin que `deploy.yml`. Si se sube aquí, subirlo allí también:
          # verificar con una versión y publicar con otra deja de ser una red.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `bun run build` es también el typecheck (`tsc -b && vite build`), y
      # deja el `dist/` que el golden del bundle necesita para no saltarse.
      # `prebuild` puebla `public/pyodide/`, que los golden de PySlope cargan.
      #
      # Sin secreto de IA: aquí no se publica nada, y un PR desde un fork no
      # tendría acceso a él de todos modos. `VITE_AI_SHARED_GEMINI_KEY` vacía
      # sólo desactiva la clave compartida del asistente.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:run
