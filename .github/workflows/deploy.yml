name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Mismo pin que `ci.yml`. Si se sube aquí, subirlo allí también.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          # Clave Gemini compartida del asistente IA: vive SOLO en el Secret del
          # repo (Settings → Secrets → Actions), nunca en el código. Se hornea en
          # el bundle servido al compilar. Ver src/lib/ai/sharedKey.ts.
          VITE_AI_SHARED_GEMINI_KEY: ${{ secrets.VITE_AI_SHARED_GEMINI_KEY }}

      # ─────────────────────────────────────────────────────────────────────
      # LOS TESTS VAN DESPUÉS DEL BUILD, Y NO ES INDIFERENTE
      # ─────────────────────────────────────────────────────────────────────
      # `src/test/seismic-ncse02/bundle.golden.test.ts` comprueba dónde acaba
      # el dataset del Anejo 1 dentro del bundle —que no viaje en el chunk de
      # arranque y que SÍ esté en el manifiesto de precache del service
      # worker— y se salta solo si no encuentra `dist/`. En el hook de
      # pre-commit no hay build, así que ahí no corre nunca, o corre contra un
      # `dist/` viejo. Este es el único sitio donde se ejecuta siempre y
      # contra el bundle recién construido.
      #
      # Si falla, el paso de subida no llega a ejecutarse y el job `deploy`
      # queda sin su `needs`: nada roto se publica.
      - name: Test
        run: bun run test:run

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
